name: poly-arena-test

services:
  redis-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis-test-data:/data
    networks:
      - test-net

  ws-feed-test:
    build:
      context: .
      dockerfile: Dockerfile.ws_feed
    image: poly-arena-test/ws-feed
    depends_on:
      redis-test:
        condition: service_healthy
    environment:
      - DATABASE_URL=sqlite:////data/test_orders.db
      - REDIS_URL=redis://redis-test:6379
    env_file:
      - .env
    volumes:
      - api-db-data:/data   # cùng volume với api-test, dùng chung DB
    restart: unless-stopped
    networks:
      - test-net

  api-test:
    build: .
    image: poly-arena-test/api
    ports:
      - "8099:8099"
    depends_on:
      redis-test:
        condition: service_healthy
    environment:
      - DATABASE_URL=sqlite:////data/test_orders.db
      - REDIS_URL=redis://redis-test:6379
    env_file:
      - .env
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8099
      --workers 4
    volumes:
      - .:/app              # source code (hot-reload)
      - api-db-data:/data   # DB tách riêng — không mất khi rebuild image
    restart: unless-stopped
    networks:
      - test-net

  # test-bot:
  #   build: ./test_bot
  #   image: poly-arena-test/test-bot
  #   environment:
  #     - API_URL=http://api-test:8099/poly-arena
  #     - BOT_NAME=random-trader
  #     - INTERVAL_SEC=300
  #     - TRADES_PER_TICK=3
  #   depends_on:
  #     - api-test
  #   restart: unless-stopped
  #   networks:
  #     - test-net

  ui-test:
    build: ./ui
    image: poly-arena-test/ui
    environment:
      - NEXT_PUBLIC_API_URL=https://story.torilab.ai/poly-arena
    depends_on:
      - api-test
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - test-net

  nginx-test:
    image: nginx:alpine
    ports:
      - "8007:6007"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-test
      - ui-test
    restart: unless-stopped
    networks:
      - test-net

networks:
  test-net:

volumes:
  redis-test-data:
  api-db-data:       # DB data — persist qua mọi lần rebuild/restart
