# ==============================================================================
# Poly Arena - Nginx Reverse Proxy Configuration
# ==============================================================================
# Mounted as /etc/nginx/conf.d/default.conf
# (already inside the http{} block of the main nginx.conf)
#
# Routes:
#   /              → Frontend (Next.js ui-test:3000)
#   /poly-arena/   → Backend API (FastAPI api-test:8099)
# ==============================================================================

# upstream ui-test {
#     server ui-test:3000;
# }

upstream backend {
    server api-test:8099;
}

server {
    listen 6007;
    server_name _;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Root location - Frontend
    # location / {
    #     proxy_pass http://ui-test:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;

    #     # WebSocket support for Next.js HMR
    #     proxy_read_timeout 86400;
    # }

    # # Next.js HMR
    # location /_next/webpack-hmr {
    #     proxy_pass http://ui-test:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # location /_next/ {
    #     proxy_pass http://ui-test:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Backend API — CORS is handled by FastAPI middleware
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
