services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data

  ws_feed:
    build:
      context: .
      dockerfile: Dockerfile.ws_feed
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      replicas: 1

  api:
    build: .
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    command: >
      gunicorn main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 4
      --bind 0.0.0.0:8010
      --access-logfile -
      --error-logfile -
    restart: unless-stopped

volumes:
  redis-data:
